<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Control</title>
<style>
  @font-face { font-family: "Montserrat"; src: url("assets/Montserrat-var.ttf"); font-weight: 100 900; }
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --text:#e8ecf4; --muted:#8a96b0; --accent:#3b82f6; --live:#ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Montserrat", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 700; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 9px 14px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #3a4766; }
  button.on { background: var(--accent); border-color: var(--accent); }
  button.danger.on { background: var(--live); border-color: var(--live); }
  label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  input[type=number] { width: 64px; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap: 20px; padding: 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .g { text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; }
  .g .n { color: var(--muted); font-weight: 700; }
  .g small { display: block; color: var(--muted); font-weight: 500; }
  .g .tag { font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 3px 8px; border-radius: 99px; background: var(--live); visibility: hidden; }
  .g.air { border-color: var(--live); }
  .g.air .tag { visibility: visible; }
  .preview { position: relative; width: 100%; aspect-ratio: 1920 / 972; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .err { color: #fca5a5; }
</style>
</head>
<body>
<header>
  <h1>District Assembly · LED Control</h1>
  <button id="prev">◀ Prev</button>
  <button id="next">Next ▶</button>
  <button id="auto">Auto-rotate</button>
  <label>every <input type="number" id="interval" min="3" max="600"> s</label>
  <button id="blank" class="danger">Blackout</button>
</header>
<main>
  <section>
    <div class="list" id="list"></div>
    <p class="hint">Click a guest to put it on the wall. Edit <b>guests.csv</b> and save — this list and the board update within a few seconds.</p>
  </section>
  <section>
    <div class="preview"><iframe id="pv" src="index.html?preview&bg=%23000"></iframe></div>
    <p class="hint">Preview mirrors the selected guest. Keys: ← → change guest, A auto, B blackout.</p>
  </section>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const C = window.BOARD_CONFIG || { csv: "guests.csv" };
let guests = [], state = {}, csvText = "";

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false; text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const h = (rows.shift() || []).map(s => s.trim().toLowerCase().replace(/\s+/g, "_"));
  return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] || "").trim()])));
}
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function loadCSV() {
  try {
    const t = await (await fetch(C.csv + "?t=" + Date.now(), { cache: "no-store" })).text();
    if (t === csvText) return; csvText = t;
    guests = parseCSV(t).filter(g => !/^(no|n|0|false|hide)$/i.test(g.active || "yes"));
    drawList();
  } catch { $("list").innerHTML = '<p class="err">Could not load guests.csv — is serve.py running?</p>'; }
}
function drawList() {
  $("list").innerHTML = guests.map((g, i) =>
    `<button class="g" data-i="${i}"><span class="n">${i + 1}</span>
      <span>${esc([g.honorific, g.name].filter(Boolean).join(" "))}<small>${esc(g.district)} · ${esc(g.date)} ${esc(g.time)}</small></span>
      <span class="tag">ON AIR</span></button>`).join("");
  $("list").querySelectorAll(".g").forEach(b => b.onclick = () => pick(+b.dataset.i));
  drawState();
}
function drawState() {
  $("auto").classList.toggle("on", state.mode !== "manual");
  $("blank").classList.toggle("on", !!state.blank);
  if (document.activeElement !== $("interval")) $("interval").value = state.interval ?? 12;
  const air = state.mode === "manual" ? state.index : state.onAir;
  document.querySelectorAll(".g").forEach(b => b.classList.toggle("air", +b.dataset.i === air));
}
async function send(patch) {
  try { state = await (await fetch("/api/state", { method: "POST", body: JSON.stringify(patch) })).json(); drawState(); } catch {}
}
async function poll() { try { state = await (await fetch("/api/state", { cache: "no-store" })).json(); drawState(); } catch {} }

const current = () => (state.mode === "manual" ? state.index : state.onAir) ?? 0;
const pick = i => send({ mode: "manual", index: ((i % guests.length) + guests.length) % guests.length });
$("prev").onclick = () => pick(current() - 1);
$("next").onclick = () => pick(current() + 1);
$("auto").onclick = () => send({ mode: state.mode === "manual" ? "auto" : "manual", index: current() });
$("blank").onclick = () => send({ blank: !state.blank });
$("interval").onchange = e => send({ interval: Math.max(3, +e.target.value || 12) });
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") $("next").click(); else if (e.key === "ArrowLeft") $("prev").click();
  else if (e.key.toLowerCase() === "a") $("auto").click(); else if (e.key.toLowerCase() === "b") $("blank").click();
});

loadCSV(); poll();
setInterval(loadCSV, 4000); setInterval(poll, 700);
</script>
</body>
</html>
