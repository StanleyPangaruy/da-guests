<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Control</title>
<style>
  @font-face { font-family: "Montserrat"; src: url("assets/Montserrat-var.ttf"); font-weight: 100 900; }
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --text:#e8ecf4; --muted:#8a96b0; --accent:#3b82f6; --live:#ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 "Montserrat", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 700; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 9px 14px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #3a4766; }
  button.on, button.primary { background: var(--accent); border-color: var(--accent); }
  button.danger.on { background: var(--live); border-color: var(--live); }
  button.del { color: #fca5a5; }
  main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(320px, 1.4fr); gap: 20px; padding: 20px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .fields input, .fields select { min-width: 0; }
  .preview-col { position: sticky; top: 20px; }
  @media (max-width: 820px) { .preview-col { position: static; order: -1; } }
  .preview { position: relative; width: 100%; aspect-ratio: 1920 / 972; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .preview iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .card summary { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 700; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; user-select: none; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary::before { content: "▸"; transition: transform .15s; }
  .card[open] summary::before { transform: rotate(90deg); }
  .card[open] summary { margin-bottom: 12px; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .fields .wide { grid-column: 1 / -1; }
  .fields label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .fields input, .fields select { font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); color-scheme: dark; width: 100%; }
  .fields input:focus, .fields select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .actions .push { margin-left: auto; }
  @media (max-width: 520px) { .fields { grid-template-columns: 1fr; } }

  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; scroll-margin: 64px 0 12px; }
  .row:hover { border-color: #3a4766; }
  .row.air { border-color: var(--live); background: #2a1a24; box-shadow: inset 4px 0 0 var(--live); }
  .row .head { display: flex; gap: 10px; align-items: center; padding: 8px 10px 8px 12px; cursor: pointer; }
  .row .n { flex: none; width: 20px; text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; }
  .row .thumb { flex: none; width: 40px; height: 40px; border-radius: 6px; background: #0b0f18 center top / cover no-repeat; display: grid; place-items: center; color: var(--muted); }
  .row .txt { flex: 1; min-width: 0; }
  .row .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.25; }
  .main-row { margin-bottom: 6px; }
  .row small { display: block; color: var(--muted); font-weight: 500; font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { flex: none; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding: 3px 7px; border-radius: 99px; background: var(--live); display: none; }
  .row.air .tag { display: inline-block; }
  .row .edit { flex: none; padding: 5px 9px; font-size: 12px; }
  .row form { padding: 0 14px 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .add { margin-top: 8px; width: 100%; color: var(--muted); border-style: dashed; }

  /* sticky transport bar so Prev / Next / Blackout stay reachable while scrolling the list */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  body.no-pv .preview-col { display: none; }
  body.no-pv main { grid-template-columns: minmax(0, 1fr); }

  /* narrow = OBS dock / phone */
  @media (max-width: 820px) {
    body { font-size: 13px; }
    header { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 6px; padding: 8px; }
    h1 { display: none; }
    header button { padding: 9px 4px; font-size: 13px; }
    #pvToggle { padding: 9px 10px; }
    main { padding: 8px; gap: 8px; }
    .card { padding: 10px 12px; margin-bottom: 8px; }
    .card summary { font-size: 11px; }
    .card[open] summary { margin-bottom: 10px; }
    .fields input, .fields select { font-size: 13px; padding: 7px 8px; }
    .row .head { gap: 8px; padding: 6px 8px; }
    .row .thumb { width: 34px; height: 34px; }
    .row form { padding: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>District Assembly · LED Control</h1>
  <button id="prev">◀ Prev</button>
  <button id="next">Next ▶</button>
  <button id="blank" class="danger">Blackout</button>
  <button id="pvToggle" class="on" title="Show / hide the preview">👁</button>
</header>
<main>
  <section>
    <details class="card" id="eventBox" open>
      <summary>Event details</summary>
      <form id="eventForm" autocomplete="off">
        <div class="fields">
          <label class="wide">District<input name="district"></label>
          <label>Date<input name="date" type="date"></label>
          <label>Time<input name="time"></label>
          <label class="wide">Venue<input name="venue"></label>
          <label class="wide">Address<input name="address"></label>
          <label class="wide">Title above the district<input name="event_title"></label>
          <label>Main background name<input name="speaker"></label>
          <label>Main background title<input name="speaker_title"></label>
        </div>
        <div class="actions"><button type="submit" class="primary">Update wall</button></div>
      </form>
    </details>

    <div class="row main-row" id="mainRow">
      <div class="head"><span class="n"></span><span class="thumb">★</span><span class="txt"><span class="nm">Main background</span><small>Event title, no guest</small></span><span class="tag">ON AIR</span></div>
    </div>
    <div class="list" id="list"></div>
    <button class="add" id="addGuest">+ Add guest</button>
  </section>
  <section class="preview-col">
    <div class="preview"><iframe id="pv" src="index.html?preview&bg=%23000"></iframe></div>
  </section>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const C = window.BOARD_CONFIG || { csv: "guests.csv" };
let rows = [], state = {}, csvText = "", photos = [];
let editing = null;          // row object currently open in the editor
const isActive = r => !/^(no|n|0|false|hide)$/i.test(r.active || "yes");
const visible = () => rows.filter(isActive);   // same order and filter as the wall

function parseCSV(text) {
  const out = []; let row = [], f = "", q = false; text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) { const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; }
    else f += c; }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  const h = (out.shift() || []).map(s => s.trim().toLowerCase().replace(/\s+/g, "_"));
  return out.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(h.map((k, i) => [k, (r[i] || "").trim()])));
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fullName = g => [g.honorific, g.name].filter(Boolean).join(" ");

/* ---------- guests ---------- */
async function loadCSV() {
  try {
    const t = await (await fetch(C.csv + "?t=" + Date.now(), { cache: "no-store" })).text();
    if (t === csvText) return;
    csvText = t; thumbCache.clear();    // a photo may have been replaced
    if (editing) return;                // don't yank the editor away mid-typing
    rows = parseCSV(t);
    drawList();
  } catch {}
}
async function loadPhotos() {
  try { photos = await (await fetch("/api/photos", { cache: "no-store" })).json(); } catch {}
}

function drawList() {
  const v = visible();
  $("list").innerHTML = v.map((g, i) => `
    <div class="row" data-i="${i}">
      <div class="head">
        <span class="n">${i + 1}</span>
        <span class="thumb" data-src="${esc(g.photo)}">${g.photo ? "" : "?"}</span>
        <span class="txt" title="${esc(fullName(g))}&#10;${esc(g.position)}"><span class="nm">${esc(fullName(g)) || "&nbsp;"}</span><small>${esc(g.position)}</small></span>
        <span class="tag">ON AIR</span>
        <button class="edit" type="button">${g === editing ? "Close" : "Edit"}</button>
      </div>
      ${g === editing ? editorHTML(g) : ""}
    </div>`).join("");
  $("list").querySelectorAll(".row").forEach(el => {
    const i = +el.dataset.i, g = v[i];
    el.querySelector(".head").onclick = e => { if (!e.target.closest(".edit")) pick(i); };
    el.querySelector(".edit").onclick = () => toggleEdit(g);
    const f = el.querySelector("form");
    if (f) {
      f.onsubmit = e => { e.preventDefault(); saveGuest(g, f); };
      f.querySelector(".del").onclick = () => deleteGuest(g);
    }
  });
  drawAir();
  fillThumbs();
}

/* ---------- thumbnails: shrink each photo once to a tiny data URL (full-size photos are huge) ---------- */
const thumbCache = new Map();
let thumbChain = Promise.resolve();
function thumb(src) {
  if (!thumbCache.has(src)) thumbCache.set(src, thumbChain = thumbChain.then(() => new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      try {
        const S = 96, k = S / im.naturalWidth, c = document.createElement("canvas");
        c.width = S; c.height = S;
        c.getContext("2d").drawImage(im, 0, 0, S, im.naturalHeight * k);   // top of the photo = the face
        resolve(c.toDataURL("image/png"));
      } catch { resolve(""); }
      im.src = "";
    };
    im.onerror = () => resolve("");
    im.src = src + "?v=" + Date.now();
  })));
  return thumbCache.get(src);
}
function fillThumbs() {
  document.querySelectorAll("#list .thumb[data-src]").forEach(el => {
    const s = el.dataset.src;
    if (s) thumb(s).then(u => { if (u && el.dataset.src === s) el.style.backgroundImage = `url(${u})`; });
  });
}

function editorHTML(g) {
  const opts = ['<option value="">None</option>']
    .concat([...new Set([g.photo, ...photos].filter(Boolean))].map(p =>
      `<option value="${esc(p)}"${p === g.photo ? " selected" : ""}>${esc(p.replace(/^photos\//, ""))}</option>`));
  return `<form autocomplete="off">
    <div class="fields">
      <label>Honorific<input name="honorific" value="${esc(g.honorific)}"></label>
      <label>Position<input name="position" value="${esc(g.position)}"></label>
      <label class="wide">Name<input name="name" value="${esc(g.name)}"></label>
      <label class="wide">Photo<select name="photo">${opts.join("")}</select></label>
      <label class="wide">Photo size<select name="photo_fit">
        <option value="">Normal (fit the photo area)</option>
        <option value="height"${/^(height|fill|wide|big)$/i.test(g.photo_fit || "") ? " selected" : ""}>Full height (wide photo goes under the text)</option>
      </select></label>
    </div>
    <div class="actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" class="del push">Delete</button>
    </div>
  </form>`;
}

async function toggleEdit(g) {
  if (editing === g) {
    editing = null;
    if (g._new) rows = rows.filter(r => r !== g);    // unsaved new guest: drop it
    rows = csvText ? parseCSV(csvText) : rows;      // pick up any outside edits
  } else {
    if (editing && editing._new) rows = rows.filter(r => r !== editing);
    editing = g;
    await loadPhotos();
  }
  drawList();
  if (editing) $("list").querySelector(".row form input[name=name]")?.focus();
}

async function saveRows(airIndex) {
  const clean = rows.map(r => { const c = Object.assign({}, r); delete c._new; return c; });
  const body = { rows: clean };
  if (typeof airIndex === "number") body.index = airIndex;
  const r = await fetch("/api/guests", { method: "POST", body: JSON.stringify(body) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { alert(res.error || "Could not save guests.csv"); return false; }
  state = res;
  return true;
}

async function saveGuest(g, f) {
  const before = Object.assign({}, g);
  for (const el of f.elements) if (el.name) g[el.name] = el.value.trim();
  if (!g.active) g.active = "yes";
  const wasNew = g._new; delete g._new;
  if (!(await saveRows())) { Object.assign(g, before); if (wasNew) g._new = true; return; }
  editing = null; csvText = ""; drawList(); loadCSV();
}

async function deleteGuest(g) {
  if (g._new) { rows = rows.filter(r => r !== g); editing = null; drawList(); return; }
  if (!confirm(`Delete ${fullName(g) || "this guest"}?`)) return;
  const i = visible().indexOf(g), air = state.index ?? 0;
  const keep = rows;
  rows = rows.filter(r => r !== g);
  const newAir = Math.max(0, Math.min(air > i ? air - 1 : air, visible().length - 1));
  if (!(await saveRows(newAir))) { rows = keep; return; }
  editing = null; csvText = ""; drawList(); loadCSV();
}

$("addGuest").onclick = async () => {
  if (editing && editing._new) return;
  const g = { active: "yes", honorific: "", name: "", position: "", photo: "", _new: true };
  rows.push(g);
  editing = null;
  await toggleEdit(g);
  $("list").lastElementChild?.scrollIntoView({ block: "nearest" });
};

/* ---------- event details ---------- */
const form = $("eventForm"), box = $("eventBox");
let evDirty = false, evShown = "";
try { if (localStorage.getItem("eventBoxOpen") === "0") box.open = false; } catch {}
box.addEventListener("toggle", () => { try { localStorage.setItem("eventBoxOpen", box.open ? "1" : "0"); } catch {} });
form.addEventListener("input", () => { evDirty = true; });
function drawEvent() {
  const ev = state.event || {}, key = JSON.stringify(ev);
  if (evDirty || key === evShown) return;
  evShown = key;
  for (const el of form.elements) if (el.name) el.value = ev[el.name] || "";
}
form.addEventListener("submit", async e => {
  e.preventDefault();
  const ev = Object.fromEntries([...form.elements].filter(el => el.name).map(el => [el.name, el.value.trim()]));
  try {
    const r = await fetch("/api/event", { method: "POST", body: JSON.stringify(ev) });
    if (!r.ok) throw 0;
    state = await r.json(); evDirty = false; evShown = ""; drawState();
  } catch { alert("Could not update the wall"); }
});

/* ---------- on air ---------- */
let airShown = null;
function drawAir() {
  document.querySelectorAll("#list .row").forEach(el => el.classList.toggle("air", !state.main && +el.dataset.i === state.index));
  $("mainRow").classList.toggle("air", !!state.main);
  // keep the on-air guest in view when it changes (Next/Prev, keyboard, another operator)
  const key = state.main ? "main" : state.index;
  if (key !== airShown && !editing) {
    airShown = key;
    document.querySelector(".row.air")?.scrollIntoView({ block: "nearest" });
  }
}

/* ---------- preview show / hide (hidden = iframe unloaded, saves CPU in an OBS dock) ---------- */
const pvSrc = $("pv").getAttribute("src");
function setPreview(on) {
  document.body.classList.toggle("no-pv", !on);
  $("pvToggle").classList.toggle("on", on);
  const f = $("pv");
  if (on && f.getAttribute("src") !== pvSrc) f.setAttribute("src", pvSrc);
  if (!on) f.setAttribute("src", "about:blank");
  try { localStorage.setItem("preview", on ? "1" : "0"); } catch {}
}
try { if (localStorage.getItem("preview") === "0") setPreview(false); } catch {}
$("pvToggle").onclick = () => setPreview(document.body.classList.contains("no-pv"));
function drawState() {
  drawEvent();
  drawAir();
  $("blank").classList.toggle("on", !!state.blank);
}
async function send(patch) {
  try { state = await (await fetch("/api/state", { method: "POST", body: JSON.stringify(patch) })).json(); drawState(); } catch {}
}
async function poll() { try { state = await (await fetch("/api/state", { cache: "no-store" })).json(); drawState(); } catch {} }

const count = () => visible().length;
const pick = i => count() && send({ mode: "manual", main: false, index: ((i % count()) + count()) % count() });
$("mainRow").onclick = () => send({ main: true });
$("prev").onclick = () => pick(state.main ? count() - 1 : (state.index ?? 0) - 1);
$("next").onclick = () => pick(state.main ? 0 : (state.index ?? 0) + 1);
$("blank").onclick = () => send({ blank: !state.blank });
addEventListener("keydown", e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") $("next").click(); else if (e.key === "ArrowLeft") $("prev").click();
  else if (e.key.toLowerCase() === "b") $("blank").click();
});

loadPhotos(); loadCSV(); poll();
setInterval(loadCSV, 3000); setInterval(poll, 700);
</script>
</body>
</html>
