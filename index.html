<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>District Assembly Board</title>
<style>
  @font-face { font-family: "Montserrat"; src: url("assets/Montserrat-var.ttf") format("truetype"); font-weight: 100 900; }
  @font-face { font-family: "Roboto Slab"; src: url("assets/RobotoSlab-var.ttf") format("truetype"); font-weight: 100 900; }

  :root {
    --navy: #0b3a68;
    --navy-deep: #08305a;
    --red: #ee1c24;
    --ink: #111111;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Montserrat", Arial, sans-serif; }

  /* Stage = the LED canvas; board = fixed 1920×972 design scaled into it */
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #board {
    position: absolute; left: 0; top: 0;
    width: 1920px; height: 972px;   /* grows to the screen's shape (see scale()) */
    --ox: 0px; --oy: 0px;
    transform-origin: 0 0;
    background: #fff;
    overflow: hidden;
  }

  #dots { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Header */
  .province {
    position: absolute; top: 34px; left: 0; right: 0; text-align: center;
    color: var(--navy); font-weight: 600; font-size: 43px; letter-spacing: 1.5px; line-height: 1;
  }
  .band-top {
    position: absolute; top: 84px; left: 0; right: 0; height: 58px;
    background: var(--red);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 41px; letter-spacing: 12px; padding-left: 12px;
  }
  .seal { position: absolute; top: 19px; width: 192px; height: 192px; object-fit: contain; z-index: 3; }
  .seal.left { left: calc(154px + var(--ox) * .5); }
  .seal.right { right: calc(144px + var(--ox) * .5); top: 14px; width: 198px; height: 198px; }

  /* Event title + district band */
  .event-title {
    position: absolute; top: calc(226px + var(--oy)); left: calc(700px + var(--ox)); right: var(--ox); text-align: center;
    font-family: "Roboto Slab", Georgia, serif; font-weight: 800;
    color: var(--navy-deep); font-size: 72px; letter-spacing: -1.5px; line-height: 1;
  }
  .band-district {
    position: absolute; top: calc(307px + var(--oy)); left: 0; right: 0; height: 119px;
    background: linear-gradient(180deg, #a3141a 0%, #c8161e 40%, #ee1c24 100%);
  }
  .district {
    position: absolute; top: calc(307px + var(--oy)); height: 119px; left: calc(700px + var(--ox)); right: calc(40px + var(--ox));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 86px; letter-spacing: 1px; white-space: nowrap;
  }

  /* Photo */
  .photo-wrap {
    position: absolute; left: calc(30px + var(--ox)); bottom: 77px; width: 760px; height: calc(745px + var(--oy) * 2);   /* wide enough that square / broad-shoulder photos get full height */
    display: flex; align-items: flex-end; justify-content: center; z-index: 2;
  }
  /* fill the photo box: small images are scaled up, wide ones fit by width; always sits on the footer */
  .photo-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; display: block; }

  /* Guest block */
  .guest {
    position: absolute; left: calc(740px + var(--ox)); right: calc(70px + var(--ox)); top: calc(452px + var(--oy)); height: calc(428px + var(--oy));
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .name {
    color: var(--navy-deep); font-weight: 800; font-size: 86px; line-height: 1.12;
    text-wrap: balance; width: 100%; max-height: 205px;
    display: flex; align-items: center; justify-content: center;
  }
  .position { color: var(--navy); font-weight: 600; font-size: 54px; line-height: 1.05; margin-top: 2px; }
  .when { color: var(--ink); font-weight: 800; font-size: 48px; margin-top: 28px; line-height: 1; white-space: nowrap; }
  .when .sep { display: inline-block; width: 0.085em; height: 0.72em; background: var(--ink); margin: 0 0.36em; vertical-align: -0.02em; }
  .venue { color: var(--ink); font-weight: 700; font-size: 24px; margin-top: 12px; line-height: 1.2; white-space: nowrap; }
  .address { color: var(--ink); font-weight: 700; font-size: 24px; line-height: 1.2; white-space: nowrap; }

  /* Main background: no guest; title, district and event details centred */
  #board.main .event-title { left: var(--ox); }
  #board.main .band-district, #board.main .district { height: 165px; }
  #board.main .district { left: calc(40px + var(--ox)); right: calc(40px + var(--ox)); }
  #board.main .photo-wrap, #board.main .name:empty, #board.main .position:empty { display: none; }
  #board.main .guest { left: calc(60px + var(--ox)); right: calc(60px + var(--ox)); top: calc(482px + var(--oy)); height: calc(404px + var(--oy)); justify-content: center; }
  #board.main .name { max-height: none; white-space: nowrap; }
  #board.main .name:empty + .position:empty + .when { margin-top: 0; }
  #board.main .when { margin-top: 30px; }
  #board.main .venue { margin-top: 18px; }

  /* Footer */
  .footer {
    position: absolute; left: 16px; right: 16px; bottom: 12px; height: 62px;
    border: 4px solid var(--red); border-radius: 10px; box-sizing: border-box; background: #fff;
    display: flex; align-items: center; justify-content: space-evenly; z-index: 4;
  }
  .footer .item { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 500; color: #222; }
  .footer svg { width: 38px; height: 38px; flex: none; }

  /* Transitions */
  .swap { transition: opacity .55s ease, transform .55s cubic-bezier(.2,.7,.2,1); }
  #board.leaving .swap { opacity: 0; transform: translateY(18px); }
  #board.leaving .photo-wrap.swap { transform: translateX(-30px); }

  /* Status overlays */
  #blank { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .6s; pointer-events: none; z-index: 20; }
  body.is-blank #blank { opacity: 1; }
  #msg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30;
    background: #111; color: #fff; padding: 28px 36px; border-radius: 12px; font-size: 26px; line-height: 1.4;
    max-width: 1200px; display: none;
  }
  #msg code { background: #333; padding: 2px 8px; border-radius: 4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="board">
    <svg id="dots" aria-hidden="true"></svg>

    <div class="province" id="province"></div>
    <div class="band-top" id="municipality"></div>
    <img class="seal left" id="sealLeft" alt="">
    <img class="seal right" id="sealRight" alt="">

    <div class="event-title swap" id="eventTitle"></div>
    <div class="band-district"></div>
    <div class="district swap" id="district"></div>

    <div class="photo-wrap swap"><img id="photo" alt=""></div>

    <div class="guest swap">
      <div class="name" id="name"></div>
      <div class="position" id="position"></div>
      <div class="when" id="when"></div>
      <div class="venue" id="venue"></div>
      <div class="address" id="address"></div>
    </div>

    <div class="footer" id="footer"></div>
    <div id="blank"></div>
    <div id="msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
(() => {
  const C = Object.assign({
    province: "", municipality: "", eventTitle: "District Assembly",
    csv: "guests.csv", csvRefreshSeconds: 10, fit: "contain", background: "#fff", footer: []
  }, window.BOARD_CONFIG || {});

  // URL overrides: ?guest=2  ?fit=cover  ?bg=transparent  ?csv=other.csv
  const q = new URLSearchParams(location.search);
  if (q.has("fit")) C.fit = q.get("fit");
  if (q.has("bg")) C.background = q.get("bg");
  if (q.has("csv")) C.csv = q.get("csv");
  const pinned = q.has("guest") ? Math.max(0, +q.get("guest") - 1) : null;
  const isPreview = q.has("preview");   // control-page preview: mirrors the wall, never drives it

  const $ = id => document.getElementById(id);
  const board = $("board"), stage = $("stage");

  /* ---------- scaling to the LED canvas ---------- */
  let boardW = 1920, boardH = 972;
  function scale() {
    const W = innerWidth, H = innerHeight;
    stage.style.background = C.background;
    let bw = 1920, bh = 972;
    if (C.fit === "contain" || C.fit === "fill") {
      // extend the design to the screen's shape: taller screens add space above/below the middle, wider ones at the sides
      bw = Math.max(1920, Math.round(972 * W / H));
      bh = Math.max(972, Math.round(1920 * H / W));
    }
    board.style.width = bw + "px"; board.style.height = bh + "px";
    board.style.setProperty("--ox", (bw - 1920) / 2 + "px");
    board.style.setProperty("--oy", (bh - 972) / 2 + "px");
    let sx = W / bw, sy = H / bh, x = 0, y = 0;
    if (C.fit === "contain" || C.fit === "fill") { sx = sy = Math.min(sx, sy); x = (W - bw * sx) / 2; y = (H - bh * sy) / 2; }
    else if (C.fit === "cover") { sx = sy = Math.max(sx, sy); x = (W - bw * sx) / 2; y = (H - bh * sy) / 2; }
    board.style.transform = `translate(${x}px, ${y}px) scale(${sx}, ${sy})`;
    if (bw !== boardW || bh !== boardH) { boardW = bw; boardH = bh; drawDots(); if (lastShown !== null) { lastShown = null; render(true); } }
  }

  /* ---------- static chrome ---------- */
  $("province").textContent = C.province;
  $("municipality").textContent = C.municipality;
  $("sealLeft").src = C.sealLeft || ""; $("sealRight").src = C.sealRight || "";

  const ICONS = {
    web: '<circle cx="12" cy="12" r="9.5" fill="#1a73e8"/><path d="M2.5 12h19M12 2.5c3 3 3 16 0 19M12 2.5c-3 3-3 16 0 19" stroke="#fff" stroke-width="1.4" fill="none"/>',
    video: '<rect x="1.5" y="4.5" width="21" height="15" rx="3.5" fill="#e62117"/><path d="M10 8.5v7l6-3.5z" fill="#fff"/>',
    social: '<circle cx="12" cy="12" r="10" fill="#fff" stroke="#1b4fa0" stroke-width="1.6"/><path d="M9 9.5h6M9 12.5h6M9 15.5h4" stroke="#1b4fa0" stroke-width="1.6" stroke-linecap="round"/>',
    camera: '<rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="#d62976" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#d62976" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="#d62976"/>',
    phone: '<path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z" fill="#0b3a68"/>'
  };
  $("footer").innerHTML = (C.footer || []).map(f =>
    `<div class="item">${f.img ? `<img src="${f.img}" style="height:38px">` : `<svg viewBox="0 0 24 24">${ICONS[f.icon] || ""}</svg>`}<span>${esc(f.text)}</span></div>`
  ).join("");

  /* ---------- halftone dot background ---------- */
  function drawDots() {
    const svg = $("dots"); svg.setAttribute("viewBox", `0 0 ${boardW} ${boardH}`);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let out = "";
    for (let y = 20; y < boardH; y += 46) for (let x = 20; x < boardW; x += 46) {
      if (rnd() < 0.35) continue;
      const ox = x + (y / 46 % 2) * 23 + (rnd() - .5) * 10, oy = y + (rnd() - .5) * 10;
      const r = 3 + rnd() * 9;
      out += `<circle cx="${ox.toFixed(1)}" cy="${oy.toFixed(1)}" r="${r.toFixed(1)}" fill="#e3e5e8"/>`;
    }
    svg.innerHTML = out;
  }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    const rows = []; let row = [], f = "", inQ = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inQ = false; }
        else f += c;
      } else if (c === '"') inQ = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    const head = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/\s+/g, "_"));
    return rows.filter(r => r.some(v => v.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
  }

  const DAYS = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
  const MONTHS = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
  // 2026-05-08 → "FRIDAY | 8 MAY 2026" (weekday computed, so it can't be wrong). Any other text is shown as typed.
  function formatDate(s) {
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s || "");
    if (!m) return esc(s || "").replace(/\s*\|\s*/g, '<span class="sep"></span>');
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return `${DAYS[d.getDay()]}<span class="sep"></span>${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  let photoStamp = Date.now();   // changes whenever guests reload, so replaced photos show without a cache clear
  let guests = [], csvText = "", index = pinned ?? 0, lastShown = null;

  // Event details (set from control.html → event.json). Filled-in values win over CSV columns.
  const EVENT_FIELDS = ["event_title", "district", "date", "time", "venue", "address", "speaker", "speaker_title"];
  let EV = Object.assign({}, C.event || {});
  const withEvent = g => {
    const m = Object.assign({}, g);
    EVENT_FIELDS.forEach(k => { if (EV[k]) m[k] = EV[k]; });
    return m;
  };

  async function loadCSV() {
    try {
      const r = await fetch(C.csv + "?t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const t = await r.text();
      if (t === csvText) return;
      csvText = t; photoStamp = Date.now(); trimCache.clear();
      guests = parseCSV(t).filter(g => !/^(no|n|0|false|hide)$/i.test(g.active || "yes"));
      hideMsg();
      if (remote && typeof serverIndex === "number" && serverIndex < guests.length) index = serverIndex;
      if (index >= guests.length) index = 0;
      render(true);
    } catch (e) {
      if (!guests.length) showMsg(
        location.protocol === "file:"
          ? `Can't read <code>${esc(C.csv)}</code> from a local file path.<br>Run <code>python serve.py</code> in this folder and point the browser source to <code>http://localhost:8080/</code>.`
          : `Can't load <code>${esc(C.csv)}</code> (${esc(e.message)}).`);
    }
  }
  function showMsg(h) { $("msg").innerHTML = h; $("msg").style.display = "block"; }
  function hideMsg() { $("msg").style.display = "none"; }

  /* ---------- text fitting ---------- */
  function fit(el, maxPx, minPx, { maxW = el.parentElement.clientWidth, maxH = Infinity } = {}) {
    let s = maxPx; el.style.fontSize = s + "px";
    while (s > minPx && (el.scrollWidth > maxW + 1 || el.scrollHeight > maxH + 1)) { s -= 2; el.style.fontSize = s + "px"; }
  }

  /* ---------- photos: cut away empty transparent margins so every guest fills the photo area ---------- */
  const trimCache = new Map();
  const HALF_BODY = C.halfBody || 1.15;   // max height ÷ width of a guest photo (lower = crop higher)
  function trimmedPhoto(url) {
    if (trimCache.has(url)) return trimCache.get(url);
    const p = new Promise(resolve => {
      const im = new Image();
      im.onload = () => {
        try {
          const W = im.naturalWidth, H = im.naturalHeight;
          // find the visible area on a small copy (fast), then crop the full-size image
          const k = Math.min(1, 400 / Math.max(W, H)), sw = Math.max(1, Math.round(W * k)), sh = Math.max(1, Math.round(H * k));
          const c = document.createElement("canvas"); c.width = sw; c.height = sh;
          const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(im, 0, 0, sw, sh);
          const d = x.getImageData(0, 0, sw, sh).data;
          let x0 = sw, y0 = sh, x1 = -1, y1 = -1;
          for (let y = 0; y < sh; y++) for (let xx = 0; xx < sw; xx++) {
            if (d[(y * sw + xx) * 4 + 3] > 24) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
          }
          if (x1 < 0) { x0 = 0; y0 = 0; x1 = sw - 1; y1 = sh - 1; }
          const pad = 1 / k;
          const cx = Math.max(0, Math.floor(x0 / k - pad)), cy = Math.max(0, Math.floor(y0 / k - pad));
          const cw = Math.min(W, Math.ceil((x1 + 1) / k + pad)) - cx;
          let ch = Math.min(H, Math.ceil((y1 + 1) / k + pad)) - cy;
          // half body: cut the bottom off photos that go below the waist (taller than HALF_BODY × width)
          ch = Math.min(ch, Math.round(cw * HALF_BODY));
          if (cx === 0 && cy === 0 && cw === W && ch === H) return resolve(url);
          const out = document.createElement("canvas"); out.width = cw; out.height = ch;
          out.getContext("2d").drawImage(im, cx, cy, cw, ch, 0, 0, cw, ch);
          resolve(out.toDataURL("image/png"));
        } catch { resolve(url); }
      };
      im.onerror = () => resolve(url);
      im.src = url;
    });
    trimCache.set(url, p);
    return p;
  }

  /* ---------- render ---------- */
  const photoURL = g => g.photo ? g.photo + (g.photo.includes("?") ? "&" : "?") + "v=" + photoStamp : "";
  // load + trim the photo, then make sure the browser has decoded it, so it appears in the same frame as the text
  async function preparePhoto(g) {
    const url = photoURL(g);
    if (!url) return "";
    const src = await trimmedPhoto(url);
    try { const t = new Image(); t.src = src; await t.decode(); } catch {}
    return src;
  }
  function paint(g, photoSrc) {
    const isMain = !!g._main;
    board.classList.toggle("main", isMain);
    $("eventTitle").textContent = g.event_title || C.eventTitle;
    $("district").textContent = g.district || "";
    const nm = isMain ? (g.speaker || "") : [g.honorific, g.name].filter(Boolean).join(" ");
    $("name").textContent = nm;
    $("position").textContent = isMain ? (g.speaker_title || "") : (g.position || "");
    const date = formatDate(g.date);
    $("when").innerHTML = [date, esc(g.time || "")].filter(Boolean).join(" - ");
    $("venue").textContent = g.venue || "";
    $("address").textContent = g.address || "";
    const img = $("photo");
    if (photoSrc) { img.src = photoSrc; img.style.display = ""; }
    else { img.removeAttribute("src"); img.style.display = "none"; }

    const guestW = document.querySelector(".guest").clientWidth;
    fit($("district"), isMain ? 128 : 86, 40, { maxW: $("district").clientWidth });
    const hasSpeaker = isMain && !!nm;
    fit($("name"), isMain ? 96 : 86, 44, isMain ? { maxW: guestW } : { maxW: guestW, maxH: 205 });
    fit($("position"), isMain ? 56 : 54, 30, { maxW: guestW });
    fit($("when"), isMain ? (hasSpeaker ? 56 : 84) : 48, 28, { maxW: guestW });
    fit($("venue"), isMain ? (hasSpeaker ? 34 : 48) : 24, 16, { maxW: guestW });
    fit($("address"), isMain ? (hasSpeaker ? 30 : 40) : 24, 16, { maxW: guestW });
    if (isMain) return;

    // long name + long position: shrink both until date / venue / address fit above the footer
    const guest = document.querySelector(".guest"), nameEl = $("name"), posEl = $("position");
    let ns = parseFloat(nameEl.style.fontSize), ps = parseFloat(posEl.style.fontSize);
    while (guest.scrollHeight > guest.clientHeight + 1 && (ns > 44 || ps > 30)) {
      if (ns > 44) { ns -= 2; nameEl.style.fontSize = ns + "px"; }
      if (ps > 30) { ps -= 1; posEl.style.fontSize = ps + "px"; }
    }
  }

  let swapTimer, renderTicket = 0;
  function render(force) {
    if (!showMain && !guests.length) return;
    const g = showMain ? withEvent({ _main: true }) : withEvent(guests[index] || {});
    const key = JSON.stringify(g);
    if (!force && key === lastShown) return;
    if (key === lastShown && lastShown !== null) return;
    const first = lastShown === null;
    lastShown = key;
    const ticket = ++renderTicket;
    clearTimeout(swapTimer);
    if (first) { preparePhoto(g).then(src => { if (ticket === renderTicket) paint(g, src); }); return; }
    board.classList.add("leaving");
    const ready = preparePhoto(g);                               // start loading the new photo during the fade-out
    const faded = new Promise(res => { swapTimer = setTimeout(res, 560); });
    Promise.all([ready, faded]).then(([src]) => {
      if (ticket !== renderTicket) return;                       // a newer guest was picked meanwhile
      paint(g, src);
      requestAnimationFrame(() => board.classList.remove("leaving"));
    });
  }

  function go(n) {
    if (!guests.length || forceMain) return;
    showMain = false;
    index = (n + guests.length) % guests.length;
    render();
  }

  /* ---------- keyboard (when the page has focus, e.g. fullscreen Chrome) ---------- */
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(index + 1);
    else if (e.key === "ArrowLeft") go(index - 1);
    else if (e.key.toLowerCase() === "b") document.body.classList.toggle("is-blank");
    else if (e.key.toLowerCase() === "f") document.documentElement.requestFullscreen?.();
    else if (/^[1-9]$/.test(e.key)) go(+e.key - 1);
  });

  /* ---------- remote control via serve.py (/api/state) ---------- */
  let remote = false, remoteVer = -1, guestsVer = null, serverIndex = null;
  const forceMain = q.has("main");   // ?main = a browser source that always shows the main background
  let showMain = forceMain;
  async function pollRemote() {
    if (location.protocol === "file:") return;
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw 0;
      const s = await r.json();
      serverIndex = s.index;
      if (guestsVer !== null && s.guestsVersion !== guestsVer) loadCSV();   // guests edited on control page
      guestsVer = s.guestsVersion;
      if (s.event && JSON.stringify(s.event) !== JSON.stringify(EV)) { EV = s.event; render(); }
      if (pinned !== null) return;
      remote = true;
      document.body.classList.toggle("is-blank", !!s.blank);
      if (forceMain) return;
      if (isPreview) {
        if (!!s.main !== showMain) { showMain = !!s.main; if (!showMain && typeof s.index === "number") index = s.index; render(); return; }
        const want = s.index;
        if (!showMain && typeof want === "number" && want !== index) go(want);
        return;
      }
      if (s.version !== remoteVer) {
        remoteVer = s.version;
        if (s.main) { if (!showMain) { showMain = true; render(); } }
        else if (typeof s.index === "number") { if (showMain) { showMain = false; index = s.index; render(); } else go(s.index); }
      }
      // report what is on screen so the control page can show it
      if (s.onAir !== index) fetch("/api/onair", { method: "POST", body: String(index) }).catch(() => {});
    } catch { remote = false; }
  }
  setInterval(pollRemote, 600); pollRemote();

  addEventListener("resize", scale); scale(); drawDots();
  document.fonts.ready.then(() => { loadCSV(); if (showMain) render(); });
  setInterval(loadCSV, Math.max(2, C.csvRefreshSeconds) * 1000);
})();
</script>
</body>
</html>
